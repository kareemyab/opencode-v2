name: typecheck

on:
  push:
    branches: [dev, orgn]
  pull_request:
    branches: [dev, orgn]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

      - name: Check orgn desktop branding
        run: bash scripts/check-orgn-branding.sh

      - name: Audit orgn desktop telemetry hooks
        run: bash scripts/audit-orgn-telemetry.sh
