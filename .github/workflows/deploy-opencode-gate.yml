name: deploy-opencode-gate

# Auto-deploys the id-orgn app-gate Worker (packages/function/src/app-gate.ts) + the
# gated SPA to Cloudflare (cde.orgn.com) on push to the orgn branch.
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   - scopes: Account › Workers Scripts:Edit, Account › Workers KV/Assets,
#                            Zone › Workers Routes:Edit + DNS:Edit (zone orgn.com)
#   CLOUDFLARE_ACCOUNT_ID  - dfd26a927cf60b33f8e9df47f991a1fb
#   ID_ORGN_CLIENT_SECRET  - the opencode (web) client secret from id-orgn
#   SESSION_SECRET         - random 32-byte hex; keys the oc.session cookie crypto

on:
  push:
    branches: [orgn]
    paths:
      - "packages/app/**"
      - "packages/function/**"
      - ".github/workflows/deploy-opencode-gate.yml"
  workflow_dispatch:

concurrency:
  group: deploy-opencode-gate
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build gated SPA
        run: VITE_OPENCODE_GATEWAY=1 OPENCODE_CHANNEL=prod bun --cwd packages/app build

      - name: Sync Worker secrets
        working-directory: packages/function
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ID_ORGN_CLIENT_SECRET: ${{ secrets.ID_ORGN_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: |
          printf '%s' "$ID_ORGN_CLIENT_SECRET" | bunx wrangler secret put ID_ORGN_CLIENT_SECRET
          printf '%s' "$SESSION_SECRET"        | bunx wrangler secret put SESSION_SECRET
          printf '%s' "$DAYTONA_API_KEY"       | bunx wrangler secret put DAYTONA_API_KEY

      - name: Deploy Worker
        working-directory: packages/function
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
